<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一张个人名片</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
    }

    .card {
      width: min(100%, 520px);
      padding: 48px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(79, 70, 229, 0.16);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 40px;
      background: #eef2ff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: #6b7280;
      line-height: 1.8;
    }

    .learning-list {
      margin: 28px 0 0;
      padding: 20px 24px;
      text-align: left;
      background: #f8fafc;
      border-radius: 16px;
    }

    .learning-list h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .learning-list ul {
      margin: 0;
      padding-left: 22px;
      color: #4b5563;
      line-height: 1.9;
    }

    .tag {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 16px;
      color: #4338ca;
      background: #eef2ff;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }

    .github-link {
      display: block;
      width: fit-content;
      margin: 20px auto 0;
      padding: 12px 20px;
      color: #ffffff;
      background: #4338ca;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }

    .github-link:hover {
      background: #3730a3;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">👋</div>
    <h1>你好，我是 GitHub 初学者</h1>
    <p>
      这是我的第一个 Git 项目。<br>
      我正在学习记录版本、分享代码和发布网页。
    </p>
    <section class="learning-list">
      <h2>我的 GitHub 学习进度</h2>
      <ul>
        <li>创建本地仓库与提交版本</li>
        <li>连接远程仓库并推送代码</li>
        <li>使用 GitHub Pages 发布网页</li>
        <li>通过分支安全地开发新功能</li>
      </ul>
    </section>
    <span class="tag">持续学习中</span>
    <a class="github-link" href="https://github.com/midokarin" target="_blank" rel="noreferrer">
      访问我的 GitHub
    </a>
  </main>
</body>
</html>
