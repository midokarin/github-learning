<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一张个人名片</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
    }

    .card {
      width: min(100%, 520px);
      padding: 48px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(79, 70, 229, 0.16);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 40px;
      background: #eef2ff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: #6b7280;
      line-height: 1.8;
    }

    .tag {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 16px;
      color: #4338ca;
      background: #eef2ff;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">👋</div>
    <h1>你好，我是 GitHub 初学者</h1>
    <p>
      这是我的第一个 Git 项目。<br>
      我正在学习记录版本、分享代码和发布网页。
    </p>
    <span class="tag">持续学习中</span>
  </main>
</body>
</html>
